<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none" role="img" aria-label="Apartment floor plan">
  <rect width="960" height="560" fill="#FCFAF6"/>

  <!-- Outer walls -->
  <path
    d="M80 70 H700 V200 H880 V490 H80 V70 Z"
    fill="#FFFDF9"
    stroke="#163324"
    stroke-width="10"
    stroke-linejoin="miter"
  />

  <!-- Inner walls -->
  <path d="M420 75 V285" stroke="#163324" stroke-width="6"/>
  <path d="M420 200 H875" stroke="#163324" stroke-width="6"/>
  <path d="M420 285 V485" stroke="#163324" stroke-width="6"/>
  <path d="M85 285 H420" stroke="#163324" stroke-width="6"/>
  <path d="M700 205 V285 H875" stroke="#163324" stroke-width="6"/>
  <path d="M780 205 V285" stroke="#163324" stroke-width="5"/>

  <!-- Door openings -->
  <rect x="250" y="280" width="70" height="12" fill="#FFFDF9"/>
  <rect x="415" y="120" width="12" height="55" fill="#FFFDF9"/>
  <rect x="500" y="195" width="55" height="12" fill="#FFFDF9"/>
  <rect x="415" y="330" width="12" height="50" fill="#FFFDF9"/>
  <rect x="700" y="230" width="12" height="40" fill="#FFFDF9"/>
  <rect x="775" y="230" width="12" height="40" fill="#FFFDF9"/>

  <!-- Door swings -->
  <path d="M250 286 A70 70 0 0 1 320 286" fill="none" stroke="#C5A880" stroke-width="1.5"/>
  <path d="M426 120 A55 55 0 0 0 426 175" fill="none" stroke="#C5A880" stroke-width="1.5"/>
  <path d="M500 206 A55 55 0 0 1 555 206" fill="none" stroke="#C5A880" stroke-width="1.5"/>
  <path d="M426 330 A50 50 0 0 0 426 380" fill="none" stroke="#C5A880" stroke-width="1.5"/>
  <path d="M706 230 A40 40 0 0 0 706 270" fill="none" stroke="#C5A880" stroke-width="1.5"/>
  <path d="M781 230 A40 40 0 0 1 781 270" fill="none" stroke="#C5A880" stroke-width="1.5"/>

  <!-- Windows -->
  <g stroke="#5C615E" stroke-width="3">
    <path d="M140 70 H280"/>
    <path d="M140 64 H280" stroke-width="1.5" opacity="0.5"/>
    <path d="M500 70 H640"/>
    <path d="M500 64 H640" stroke-width="1.5" opacity="0.5"/>
    <path d="M880 300 V420"/>
    <path d="M886 300 V420" stroke-width="1.5" opacity="0.5"/>
    <path d="M160 490 H300"/>
    <path d="M160 496 H300" stroke-width="1.5" opacity="0.5"/>
    <path d="M520 490 H640"/>
    <path d="M520 496 H640" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Living: furniture left/bottom — label zone top-right clear -->
  <rect x="110" y="130" width="150" height="50" rx="4" fill="#E8EFEA" stroke="#163324" stroke-width="1.25"/>
  <rect x="110" y="175" width="150" height="12" rx="2" fill="#D5E0D8" stroke="#163324" stroke-width="1"/>
  <rect x="150" y="205" width="65" height="36" rx="3" fill="none" stroke="#C5A880" stroke-width="1.25"/>
  <ellipse cx="310" cy="210" rx="42" ry="24" fill="none" stroke="#163324" stroke-width="1.25"/>
  <circle cx="282" cy="200" r="4.5" fill="#E8EFEA" stroke="#163324" stroke-width="1"/>
  <circle cx="338" cy="200" r="4.5" fill="#E8EFEA" stroke="#163324" stroke-width="1"/>
  <circle cx="282" cy="220" r="4.5" fill="#E8EFEA" stroke="#163324" stroke-width="1"/>
  <circle cx="338" cy="220" r="4.5" fill="#E8EFEA" stroke="#163324" stroke-width="1"/>

  <!-- Kitchen: counters top — label in open floor below island -->
  <path d="M450 90 H670 V140 H610 V115 H450 Z" fill="#E8EFEA" stroke="#163324" stroke-width="1.25"/>
  <rect x="455" y="95" width="50" height="16" rx="2" fill="#FFFDF9" stroke="#5C615E" stroke-width="1"/>
  <rect x="630" y="95" width="28" height="40" rx="2" fill="#FFFDF9" stroke="#5C615E" stroke-width="1"/>
  <rect x="500" y="135" width="80" height="28" rx="3" fill="#E8EFEA" stroke="#163324" stroke-width="1.25"/>

  <!-- Bath: tub bottom — label top center of 700–780 -->
  <rect x="714" y="255" width="52" height="22" rx="9" fill="none" stroke="#163324" stroke-width="1.25"/>

  <!-- WC: toilet bottom — label top center of 780–875 -->
  <circle cx="828" cy="255" r="11" fill="none" stroke="#163324" stroke-width="1.25"/>
  <rect x="810" y="268" width="36" height="9" rx="2" fill="#E8EFEA" stroke="#163324" stroke-width="1"/>

  <!-- Hall closet -->
  <path d="M620 215 H690 V270" fill="none" stroke="#C5A880" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Primary bedroom: bed left, wardrobe right edge — label top center clear -->
  <rect x="115" y="350" width="115" height="100" rx="4" fill="#E8EFEA" stroke="#163324" stroke-width="1.25"/>
  <rect x="115" y="350" width="115" height="18" rx="3" fill="#D5E0D8" stroke="#163324" stroke-width="1"/>
  <rect x="125" y="460" width="26" height="16" rx="2" fill="none" stroke="#C5A880" stroke-width="1"/>
  <rect x="190" y="460" width="26" height="16" rx="2" fill="none" stroke="#C5A880" stroke-width="1"/>
  <rect x="320" y="400" width="70" height="70" rx="2" fill="#E8EFEA" stroke="#163324" stroke-width="1"/>
  <path d="M343 400 V470 M355 400 V470 M367 400 V470" stroke="#163324" stroke-width="1"/>

  <!-- Study: bed left, desk right-bottom — label top-right clear -->
  <rect x="455" y="360" width="95" height="65" rx="3" fill="#E8EFEA" stroke="#163324" stroke-width="1.25"/>
  <rect x="455" y="360" width="95" height="14" rx="2" fill="#D5E0D8" stroke="#163324" stroke-width="1"/>
  <rect x="600" y="410" width="70" height="38" rx="2" fill="none" stroke="#163324" stroke-width="1.25"/>
  <rect x="610" y="418" width="50" height="7" fill="#E8EFEA"/>

  <!-- Labels in empty floor only -->
  <g
    fill="#1C1E1D"
    font-family="Schibsted Grotesk, Segoe UI, sans-serif"
    text-anchor="middle"
    font-weight="700"
  >
    <!-- Living clear band above furniture -->
    <text x="300" y="100" font-size="12" letter-spacing="0.04em">LIVING &amp; DINING</text>
    <text x="300" y="116" font-size="10" fill="#5C615E" font-weight="500">5.4m × 4.8m</text>

    <!-- Kitchen open floor under island -->
    <text x="560" y="185" font-size="12" letter-spacing="0.04em">KITCHEN</text>

    <!-- Bath / WC upper clear halves -->
    <text x="740" y="226" font-size="11" letter-spacing="0.06em">BATH</text>
    <text x="828" y="226" font-size="11" letter-spacing="0.06em">WC</text>

    <!-- Bedroom clear strip under corridor wall -->
    <text x="250" y="318" font-size="12" letter-spacing="0.04em">PRIMARY BEDROOM</text>

    <!-- Study clear strip under corridor wall -->
    <text x="700" y="318" font-size="12" letter-spacing="0.04em">STUDY / BED 2</text>
  </g>

  <!-- Dimensions -->
  <g stroke="#C5A880" stroke-width="1" fill="#5C615E" font-family="Schibsted Grotesk, Segoe UI, sans-serif" font-size="10">
    <path d="M80 520 H700"/>
    <path d="M80 515 V525"/>
    <path d="M700 515 V525"/>
    <text x="390" y="540" text-anchor="middle">± 12.4 m</text>

    <path d="M900 70 V490"/>
    <path d="M895 70 H905"/>
    <path d="M895 490 H905"/>
    <text x="930" y="290" text-anchor="middle" transform="rotate(90 930 290)">± 8.2 m</text>
  </g>

  <!-- North -->
  <g transform="translate(50 500)">
    <circle cx="18" cy="18" r="16" fill="#FFFDF9" stroke="#163324" stroke-width="1.25"/>
    <path d="M18 8 L22 22 L18 19 L14 22 Z" fill="#163324"/>
    <text x="18" y="42" text-anchor="middle" fill="#5C615E" font-size="9" font-family="Schibsted Grotesk, Segoe UI, sans-serif" font-weight="700">N</text>
  </g>
</svg>
